<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Goal Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --border: rgba(11,11,11,0.10);
  --border-strong: rgba(11,11,11,0.18);
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  /* direction hues (categorical slots 1-4) */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  /* status — reserved, always paired with icon + label */
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --warn-text: #7a5000; --warn-bg: rgba(250,178,25,0.14);
  --crit: #d03b3b; --crit-text: #b02a2a; --crit-bg: rgba(208,59,59,0.10);
  --heat-0: #ebeae5;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --radius: 14px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242423;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
    --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --accent-ink: #ffffff;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --good-text: #0ca30c; --warn-text: #fab219; --warn-bg: rgba(250,178,25,0.12);
    --crit-text: #f07272; --crit-bg: rgba(208,59,59,0.16);
    --heat-0: #262625;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #242423;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
  --text: #ffffff; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --accent-ink: #ffffff;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --good-text: #0ca30c; --warn-text: #fab219; --warn-bg: rgba(250,178,25,0.12);
  --crit-text: #f07272; --crit-bg: rgba(208,59,59,0.16);
  --heat-0: #262625;
  --shadow: none;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
}
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2 { font-size: 1.02rem; font-weight: 650; }
h3 { font-size: 0.95rem; font-weight: 600; }
.muted { color: var(--text-2); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header & nav ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 1.05rem; }
.brand span { font-size: 0.8rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topnav { display: none; margin-left: auto; gap: 2px; }
.topnav a { padding: 7px 11px; border-radius: 9px; color: var(--text-2); font-size: 0.92rem; }
.topnav a:hover { background: var(--surface-2); color: var(--text); }
.topnav a[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
}
.bottomnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 0.7rem; }
.bottomnav a svg { width: 22px; height: 22px; }
.bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 600; }
@media (min-width: 760px) {
  .topnav { display: flex; }
  .bottomnav { display: none; }
  body { padding-bottom: 40px; }
}

/* ---------- Layout ---------- */
main { max-width: 1040px; margin: 0 auto; padding: 16px; }
.stack > * + * { margin-top: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head .link { font-size: 0.88rem; white-space: nowrap; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
.grid-3 { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.page-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
.page-title h1 { font-size: 1.35rem; }

/* ---------- Buttons & forms ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  cursor: pointer; font-weight: 550; font-size: 0.92rem; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--crit-text); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.btn-danger:hover { background: var(--crit-bg); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: 0.85rem; border-radius: 8px; }
.btn-block { display: flex; width: 100%; }
.icon-btn { border: 0; background: transparent; color: var(--text-2); cursor: pointer; padding: 6px 8px; border-radius: 8px; font-size: 0.85rem; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

label.field { display: block; margin-bottom: 12px; }
label.field > span, .field-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 42px; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--bg); color: var(--text);
  font-size: 16px; /* prevents iOS zoom */
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 140px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.actions .spacer { flex: 1; }

/* segmented choice chips (radio) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0 0 12px; }
.chips legend { padding: 0; margin-bottom: 5px; font-size: 0.82rem; font-weight: 600; color: var(--text-2); }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip > span {
  display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 7px 12px;
  border: 1px solid var(--border-strong); border-radius: 999px; font-size: 0.9rem; cursor: pointer; user-select: none;
}
.chip input:checked + span { border-color: var(--text); background: var(--surface-2); font-weight: 600; box-shadow: inset 0 0 0 1px var(--text); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.presets button { min-height: 34px; min-width: 46px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 0.88rem; }
.presets button:hover { border-color: var(--border-strong); }

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); vertical-align: 1px; }

/* ---------- Banners & status ---------- */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 0.92rem; }
.banner .b-icon { flex: none; font-size: 1.05rem; line-height: 1.3; }
.banner .b-body { flex: 1; }
.banner.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.banner.crit { background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.banner.info { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.s-good { color: var(--good-text); }
.s-warn { color: var(--warn-text); }
.s-crit { color: var(--crit-text); }

/* ---------- Today ---------- */
.today-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--border); }
.today-row:first-of-type { border-top: 0; padding-top: 2px; }
.today-label { display: flex; align-items: center; gap: 9px; flex: 1 1 130px; min-width: 0; font-weight: 550; }
.today-val { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; font-weight: 600; }
.today-val.zero { color: var(--muted); font-weight: 450; }
.quick { display: flex; gap: 6px; }
.qbtn {
  min-width: 46px; min-height: 40px; padding: 0 8px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-size: 0.88rem; font-weight: 600;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
.qbtn:hover { background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-color: var(--c); }
.qbtn:active { transform: scale(0.96); }
@media (max-width: 480px) {
  .quick { flex: 1 1 100%; }
  .quick .qbtn { flex: 1; }
}

/* ---------- Streak cards ---------- */
.streaks { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .streaks { grid-template-columns: repeat(3, 1fr); } }
.streak { position: relative; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.streak::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.streak.warning { border-color: color-mix(in srgb, var(--warn) 65%, transparent); background: var(--warn-bg); }
.streak.reset { border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
.streak-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.streak-name { font-weight: 600; font-size: 0.92rem; }
.streak-best { font-size: 0.8rem; color: var(--text-2); }
.streak-num { font-size: 2rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.streak-num small { font-size: 0.85rem; font-weight: 500; color: var(--text-2); margin-left: 4px; }
.streak-state { font-size: 0.85rem; margin-top: 2px; min-height: 1.3em; }
.strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 10px; }
.strip i { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); }
.strip i.q { background: var(--c); }
.strip i.p { background: color-mix(in srgb, var(--c) 30%, var(--heat-0)); }
.strip i.t { box-shadow: 0 0 0 1.5px var(--text); }

/* ---------- Progress ---------- */
.prog + .prog { margin-top: 14px; }
.prog-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
.prog-name { font-weight: 550; flex: 1; }
.prog-val { font-variant-numeric: tabular-nums; font-weight: 600; }
.prog-val small { font-weight: 450; color: var(--text-2); }
.bar { position: relative; height: 10px; border-radius: 999px; background: var(--heat-0); overflow: visible; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--c); min-width: 0; transition: width .3s ease; }
.bar .fill.over { background: var(--crit); }
.bar .fill.near { background: var(--warn); }
.bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; opacity: 0.55; }
.prog-sub { font-size: 0.82rem; color: var(--text-2); margin-top: 5px; }

/* ---------- Plans ---------- */
.plan-group + .plan-group { margin-top: 14px; }
.plan-group h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.plan { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.plan + .plan { margin-top: 6px; }
.plan-text { flex: 1; font-size: 0.95rem; }
.plan-text b { font-weight: 650; }
.plan.obstacle { background: transparent; border: 1px dashed var(--border-strong); }

/* ---------- Milestones ---------- */
.ms { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
.ms:first-child { border-top: 0; }
.ms input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; cursor: pointer; }
.ms-body { flex: 1; min-width: 0; }
.ms-title { font-weight: 550; }
.ms.done .ms-title { text-decoration: line-through; color: var(--text-2); }
.ms-date { font-size: 0.82rem; color: var(--text-2); }
.ms-count { text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.ms-count b { display: block; font-size: 1.25rem; line-height: 1.1; }
.ms-count span { font-size: 0.75rem; color: var(--text-2); }

/* ---------- History ---------- */
.day-group { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; font-size: 0.85rem; color: var(--text-2); font-weight: 600; }
.entry { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; }
.entry:first-child { border-top: 0; }
.entry:hover { background: var(--surface-2); }
.entry-main { flex: 1; min-width: 0; }
.entry-note { font-size: 0.85rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-min { font-variant-numeric: tabular-nums; font-weight: 600; }
.list-card { padding: 4px 0; overflow: hidden; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

/* ---------- Stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
@media (min-width: 520px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.tile .t-label { font-size: 0.74rem; color: var(--text-2); font-weight: 550; }
.tile .t-val { font-size: 1.2rem; font-weight: 700; margin-top: 1px; }
.tile .t-sub { font-size: 0.72rem; color: var(--text-2); }
.chart-box { position: relative; height: 190px; }
.chart-box.tall { height: 280px; }
.chart-cap { font-size: 0.78rem; color: var(--text-2); margin-top: 6px; }
.chart-fallback { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 0.85rem; color: var(--text-2); text-align: center; border: 1px dashed var(--border-strong); border-radius: 10px; padding: 12px; }
.heat-wrap { margin-top: 14px; }
.heat-months { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 2px; font-size: 0.68rem; color: var(--text-2); height: 14px; margin-bottom: 2px; }
.heat-months span { white-space: nowrap; overflow: visible; }
.heat { display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 2px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: var(--heat-0); cursor: pointer; }
.heat i.l1 { background: color-mix(in srgb, var(--c) 22%, var(--heat-0)); }
.heat i.l2 { background: color-mix(in srgb, var(--c) 48%, var(--heat-0)); }
.heat i.l3 { background: color-mix(in srgb, var(--c) 75%, var(--heat-0)); }
.heat i.l4 { background: var(--c); }
.heat i.f { background: transparent; cursor: default; }
.heat i.sel { box-shadow: 0 0 0 1.5px var(--text); }
.heat-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.75rem; color: var(--text-2); min-height: 18px; }
.heat-legend { display: inline-flex; align-items: center; gap: 2px; }
.heat-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--heat-0); }
.share { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; margin: 8px 0 10px; background: var(--surface); }
.share div { background: var(--c); min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
td:not(:first-child) { white-space: nowrap; }
th { color: var(--text-2); font-weight: 600; }
.table-scroll { overflow-x: auto; }
details summary { cursor: pointer; font-size: 0.88rem; color: var(--text-2); padding: 6px 0; }

/* ---------- Review ---------- */
.review-past { border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px; background: var(--surface); }
.review-past + .review-past { margin-top: 8px; }
.review-past summary { color: var(--text); font-weight: 600; padding: 10px 0; }
.review-text { white-space: pre-wrap; font-size: 0.92rem; margin: 4px 0 10px; }
.commit { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface-2); border-radius: 0 10px 10px 0; font-size: 0.92rem; }

/* ---------- Settings ---------- */
.dir-set { border-top: 1px solid var(--border); padding: 12px 0; }
.dir-set:first-of-type { border-top: 0; padding-top: 0; }
.dir-set .row > * { flex: 1 1 120px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- FAB, dialog, toast ---------- */
.fab {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); z-index: 25;
  width: 58px; height: 58px; border-radius: 18px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-size: 30px; line-height: 1;
  box-shadow: 0 6px 20px rgba(0,0,0,0.22);
}
.fab:active { transform: scale(0.95); }
@media (min-width: 760px) { .fab { bottom: 28px; right: 28px; } }
dialog {
  width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto;
  border: 1px solid var(--border); border-radius: 18px; padding: 18px;
  background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
dialog::backdrop { background: rgba(0,0,0,0.45); }
dialog h2 { font-size: 1.1rem; margin-bottom: 14px; }
@media (max-width: 560px) {

}

.empty { color: var(--text-2); font-size: 0.92rem; padding: 6px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

  <a href="#settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>More</a>
